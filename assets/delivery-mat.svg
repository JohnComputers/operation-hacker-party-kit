<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="title desc">
  <title id="title">Delivery C - door mat</title>
  <desc id="desc">A porch door mat lifted at one corner to reveal an envelope, beside a B526 parcel sign.</desc>
  <defs>
    <linearGradient id="door" x1="0" x2="1"><stop stop-color="#204f57"/><stop offset=".5" stop-color="#34717a"/><stop offset="1" stop-color="#17434c"/></linearGradient>
    <pattern id="matPattern" width="18" height="18" patternUnits="userSpaceOnUse"><rect width="18" height="18" fill="#81684b"/><path d="M0 9h18M9 0v18" stroke="#6a543d" stroke-width="2" opacity=".6"/></pattern>
    <filter id="grain"><feTurbulence baseFrequency=".8" numOctaves="3" stitchTiles="stitch" type="fractalNoise"/><feColorMatrix values="0 0 0 0 .08 0 0 0 0 .12 0 0 0 0 .14 0 0 0 .07 0"/><feBlend in="SourceGraphic" mode="multiply"/></filter>
  </defs>
  <rect width="800" height="520" fill="#c6aa80"/>
  <rect x="154" width="492" height="296" rx="5" fill="url(#door)"/>
  <rect x="182" y="28" width="436" height="239" rx="3" fill="none" stroke="#a5c4bd" stroke-width="8" opacity=".4"/>
  <circle cx="567" cy="148" r="17" fill="#d7b766"/>
  <path d="M0 318h800" stroke="#8d704f" stroke-width="12"/>
  <g transform="translate(181 338)">
    <path d="M0 0h438v140H0z" fill="url(#matPattern)" stroke="#51412f" stroke-width="8"/>
    <path d="M329 140h109V58c-21 33-52 58-109 82Z" fill="#b59b74" stroke="#51412f" stroke-width="5"/>
    <text x="196" y="85" fill="#e9dec9" font-family="sans-serif" font-size="31" font-weight="700" letter-spacing="7" text-anchor="middle">WELCOME</text>
  </g>
  <g transform="translate(499 421) rotate(-3)">
    <path d="M0 0h119v72H0z" fill="#efe2ba" stroke="#9b784a" stroke-width="4"/>
    <path d="m2 3 57 37 58-37" fill="none" stroke="#9b784a" stroke-width="4"/>
  </g>
  <g transform="rotate(-5 650 337)">
    <rect x="589" y="291" width="132" height="91" rx="4" fill="#f7f3e9" stroke="#192e38" stroke-width="5"/>
    <text x="655" y="347" fill="#192e38" font-family="monospace" font-size="31" font-weight="700" text-anchor="middle">B526</text>
  </g>
  <rect x="23" y="23" width="136" height="39" rx="19" fill="#102b34" opacity=".9"/>
  <text x="91" y="49" fill="#fff" font-family="monospace" font-size="18" font-weight="700" text-anchor="middle">DELIVERY C</text>
  <rect width="800" height="520" fill="transparent" filter="url(#grain)"/>
</svg>
